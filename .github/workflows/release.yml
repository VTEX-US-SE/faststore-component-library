name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@vtex-us-se'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Versions and publishes directly on push to main, in one step — no intermediate
      # "Version Packages" PR (changesets/action's usual flow), because the VTEX-US-SE org
      # disallows GitHub Actions from creating pull requests, org-wide. Trade-off: a version
      # bump lands on main without a review step of its own; acceptable for this low-stakes
      # internal library. If there are no pending changesets, this is a no-op.
      - name: Version and publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(ls .changeset/*.md 2>/dev/null)" ]; then
            echo "No pending changesets — nothing to version or publish."
            exit 0
          fi

          pnpm version-packages
          git add -A
          git commit -m "chore: version packages [skip ci]"
          pnpm release
          git push --follow-tags
